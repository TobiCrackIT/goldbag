allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@sentry/cli': true
  bufferutil: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  utf-8-validate: true

patchedDependencies:
  expo-modules-jsi@57.0.4: patches/expo-modules-jsi@57.0.4.patch
