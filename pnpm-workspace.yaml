packages:
  - "apps/*"
  - "packages/*"

onlyBuiltDependencies:
  - esbuild
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@sentry/cli': true
  bufferutil: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  utf-8-validate: true

# patchedDependencies: expo-modules-jsi@57.0.4 — disabled for EAS builds.
# The patch fixes Swift 6.2 (Xcode 26) local compilation; EAS pins the
# toolchain SDK 57 expects, where the original source compiles and
# nonisolated(unsafe) may not be available. Re-enable only for local iOS.
